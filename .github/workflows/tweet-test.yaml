name: Tweet Microservice Tests

on:
  pull_request:
    paths:
      - 'tweet/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask==2.0.1 werkzeug==2.0

      - name: Debug directory structure
        run: |
          echo "Listing workspace contents:"
          ls -R

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/tweet
        run: |
          python -m unittest discover -s tweet/tests