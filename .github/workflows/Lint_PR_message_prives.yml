name: Lint Messages_prives PR Workflow

on:
  pull_request:
    branches: ["main"]
    paths:
      - "messages_prives/**"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v3

      # Étape 2 : Configurer Python (si c'est un projet Python)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9  # Spécifie la version de Python

      # Étape 3 : Installer les dépendances (à partir de requirements.txt)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Étape 4 : Exécuter le linter
      - name: Run Linter
        run: |
          # Exécuter un linter comme flake8 sur le dossier messages_prives
          pip install flake8
          flake8 messages_prives --max-line-length=100
